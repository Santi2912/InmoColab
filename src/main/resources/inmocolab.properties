# Persistencia de InmoColab.
#   postgresql -> guarda todo en PostgreSQL (crea la base de datos y las tablas si no existen)
#   memoria    -> solo memoria, los datos se pierden al reiniciar Tomcat
# Si PostgreSQL no responde, la aplicación arranca igual en modo memoria.
persistencia=postgresql

db.url=jdbc:postgresql://localhost:5432/inmocolab
db.usuario=postgres
db.clave=postgres

# MongoDB (NoSQL): comentarios y calificaciones. Si no está encendido, esos datos quedan solo en memoria.
mongo.activo=true
mongo.uri=mongodb://localhost:27017/?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000
mongo.base=inmocolab
